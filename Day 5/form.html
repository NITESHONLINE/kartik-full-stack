<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form action="">
        <label for="username">Username</label>
        <input type="text" id="username"> <br>
        <label for="email">Email</label>
        <input type="email" id="email"> <br>

        <label for="password">Password</label>
        <input type="password" id="password"> <br>
       
        <label for="phone">Phone</label>
        <input type="number" id="phone"> <br>

        <label for="phone">Phone</label>
        <input type="tel" id="phone" readonly placeholder="9876543212"> <br>

        <label for="file">file</label>
        <input type="file" id="file"> <br>

        <label for="url">url</label>
        <input type="url" id="url" required> <br>

        <label for="date">Date</label>
        <input type="date" id="date"> <br>
       
        <label for="time">Time</label>
        <input type="time" id="time"> <br>
        
        <label for="timeandtime">Date & Time</label>
        <input type="datetime-local" id="timeandtime"> <br>
        
        <label for="range">range</label>
        <input type="range" id="range"> <br>

        <label for="token">token</label>
        <input type="hidden" value="asdfsdfsdf" id="token"> <br>
        
        <label for="color">color</label>
        <input type="color" value="" id="color"> <br>
        
        <label for="search">search</label>
        <input type="search" value="" id="search"> <br>

        <label for="course">Select course:</label>
        <select name="course" id="course">
            <option value="python">Python</option>
            <option value="java">JAVA</option>
            <option value="mern">MERN Stack</option>
        </select><br>

        <label for="python">Python</label>
        <input type="checkbox" name="course" id="python" value="python">
        <label for="java">java</label>
        <input type="checkbox" name="course" id="java" value="java">
        <label for="mern">mern</label>
        <input type="checkbox" name="course" id="mern" value="mern">

        <h3>Select your gender:</h3>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" value="female">
        
        <label for="comment">Comment</label>
        <textarea placeholder="comment" name="comment" id="comment" cols="30" rows="10"></textarea>


        <br>
        <input type="reset" value="reset">
        <input type="submit" value="submit">
        <input type="image" src="https://images.pexels.com/photos/36968704/pexels-photo-36968704/free-photo-of-serene-woman-in-lush-greenery-at-daytime.jpeg?auto=compress&w=600" width="100" >
        <button>Save</button>
    </form>

</body>
</html>
